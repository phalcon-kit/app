name: App CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PHALCON_VERSION: 5.22.0
  PHALCON_PECL_URL: https://github.com/phalcon/cphalcon/releases/download/v5.22.0/phalcon-pecl.tgz
  PHALCON_PECL_SHA256: da783fc9157cff533aa6f44f01134237fa1542c1310cbd06299340d4a6252979

permissions:
  contents: read

jobs:
  quality:
    name: PHP 8.5 locked dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: phalconkit_app_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          extensions: intl, mbstring, pdo_mysql, sodium, xml
          tools: composer

      - name: Install Phalcon
        run: bash .github/scripts/install-phalcon.sh

      - name: Install locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run quality gate
        run: composer qa

      - name: Verify adopted baseline and application SQL migration
        run: |
          cp .env.example .env
          cat >> .env <<'ENV'
          DATABASE_HOST=127.0.0.1
          DATABASE_DBNAME=phalconkit_app_test
          DATABASE_USERNAME=root
          DATABASE_PASSWORD=""
          ENV
          cp -R vendor/phalcon-kit/core/resources/migrations/4.0.0 resources/migrations/
          ./scripts/migration-list.sh
          ./scripts/migration-run.sh
          ./scripts/migration-run.sh
          mkdir -p resources/migrations/4.0.1/sql
          cat > resources/migrations/4.0.1/products.php <<'PHP'
          <?php
          declare(strict_types=1);
          class ProductsMigration_401 extends \PhalconKit\Migrations\SqlMigration
          {
              public function morph(): void
              {
                  $this->executeSqlFile(__DIR__ . '/sql/create-products.sql');
              }
          }
          PHP
          cat > resources/migrations/4.0.1/sql/create-products.sql <<'SQL'
          CREATE TABLE products (id BIGINT UNSIGNED PRIMARY KEY, name VARCHAR(120) NOT NULL)
          ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
          SQL
          ./scripts/migration-run.sh
          php -r '$db = new PDO("mysql:host=127.0.0.1;dbname=phalconkit_app_test", "root", ""); if ((int) $db->query("SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA = DATABASE()")->fetchColumn() !== 31 || $db->query("SELECT MAX(version) FROM phalcon_migrations")->fetchColumn() !== "4.0.1") { exit(1); }'
          (cd "${RUNNER_TEMP}" && "${GITHUB_WORKSPACE}/scripts/migration-list.sh")

      - name: Verify entrypoints and scripts
        run: |
          bash -n scripts/*.sh
          shellcheck .github/scripts/install-phalcon.sh scripts/*.sh
          ./bin/phalcon-kit --help
          (cd "${RUNNER_TEMP}" && "${GITHUB_WORKSPACE}/bin/phalcon-kit" --help)
          ./vendor/bin/phalcon-migrations --help
          if ./bin/websocket >"${RUNNER_TEMP}/websocket.out" 2>&1; then
            echo "bin/websocket unexpectedly started without Swoole" >&2
            exit 1
          fi
          grep -F "The optional Swoole extension is required" "${RUNNER_TEMP}/websocket.out"

  lowest-dependencies:
    name: PHP 8.5 lowest dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          extensions: intl, mbstring, pdo_mysql, sodium, xml
          tools: composer

      - name: Install Phalcon
        run: bash .github/scripts/install-phalcon.sh

      - name: Install lowest supported dependencies
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
        with:
          dependency-versions: lowest
          custom-cache-suffix: phalcon-kit-app

      - name: Run quality gate
        run: composer qa

  powershell-syntax:
    name: PowerShell helper syntax
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse PowerShell helpers
        shell: pwsh
        run: |
          $failed = $false

          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
              $tokens = $null
              $parseErrors = $null
              [void] [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName,
                  [ref] $tokens,
                  [ref] $parseErrors
              )

              if ($parseErrors.Count -gt 0) {
                  $parseErrors | ForEach-Object { Write-Error $_ }
                  $failed = $true
              }
          }

          if ($failed) {
              exit 1
          }
