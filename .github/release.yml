changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Security
      labels:
        - security
    - title: Added
      labels:
        - enhancement
    - title: Fixed
      labels:
        - bug
    - title: Maintenance
      labels:
        - dependencies
        - documentation
        - ci
    - title: Other Changes
      labels:
        - "*"
